<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="search">
    <button onclick="display()">Click ME</button>
    <p></p>
    <script>
        function display() {


            // let data = ["shoes", "car", "bike " ,"shoes for boys" , "shoes "]
            let data = [
                "shoes",
                "car",
                "bike",
                "shoes for boys",
                "apple",
                "banana",
                "shirt",
                "mobile",
                "mango",
                "cat",
                "school",
                "dog"
            ];
            let search = document.getElementById("search");
            let res = search.value;
            console.log(res);

            let result = data.filter((ele) => {
                return ele.trim().toLocaleLowerCase().toLocaleLowerCase().startsWith(res)
            })
            console.log(result);


            result.map((ele) => {
                let p = document.createElement("p")
                p.innerHTML = ele;
                document.body.appendChild(p)
            })

        }







    </script>
</body>

</html>
