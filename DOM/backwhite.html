<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
       setInterval(() => {
    let bgclr = document.body.style.backgroundColor;
    document.body.style.backgroundColor = (bgclr === 'black') ? 'white' : 'black';
}, 2000);

    </script>
</body>

</html>
