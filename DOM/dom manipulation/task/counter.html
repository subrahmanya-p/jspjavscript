<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
        }

        div {
            width: 120px;
            padding: 10px;
            border: 1px solid red;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        i {
            cursor: pointer;
            color: red;
        }

        p {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
        }

        #reset {
            margin-left: 20px;
            padding: 10px 50px 10px 50px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <i onclick="add()" class="fa-solid fa-plus"></i>
        <p id="h1">0</p>
        <i onclick="sub()" class="fa-solid fa-minus"></i>
    </div>
    <button id="reset" onclick="reset()">
        reset
    </button>
    <!-- <button onclick="add()">
        <!-- +
    </button>
    <h1 id="h1">



    </h1>
    <button onclick="sub()">
        -
    </button> -->

    <script>
        let count = 0;
        let h1 = document.getElementById("h1");
        h1.innerText = count

        function add() {
            count++;
            h1.innerText = count;


        }

        function sub() {
            if (count <= 0) {
                return;

            } count--;
            h1.innerText = count;


        }
        function reset() {
            count = 0;
            h1.innerText = count;

        }
    </script>
</body>

</html>
