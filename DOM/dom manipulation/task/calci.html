<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        input {
            width: 200px;
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #555;
        }

        h1 {
            margin-top: 25px;
            color: green;
        }
    </style>
</head>

<body>

    <input type="number" id="first" placeholder="First number">
    <br>

    <input type="number" id="second" placeholder="Second number">
    <br>

    <button onclick="add()">Add</button>
    <button onclick="sub()">Sub</button>
    <button onclick="mul()">Multiply</button>
    <button onclick="div()">Division</button>

    <button onclick="ss()">Clear</button>
    <h1 id="h1"></h1>

    <script>
        let res = document.getElementById("h1");
        document.getElementById("second").value = 0;
        document.getElementById("first").value = 0;
        function ss() {


            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);
            document.getElementById("second").value = 0;
            document.getElementById("first").value = 0;
        }

        function add() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            res.innerText = first + second;
        }

        function sub() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            res.innerText = first - second;
        }

        function mul() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            res.innerText = first * second;
        }

        function div() {
            let first = Number(document.getElementById("first").value);
            let second = Number(document.getElementById("second").value);

            if (second == 0) {
                res.innerText = "Cannot divide by zero";
                res.style.color = "red"
                return;
            }

            res.innerText = first / second;
        }
    </script>

</body>

</html>
