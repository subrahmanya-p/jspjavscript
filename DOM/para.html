    <button onclick="change()">Click Me !</button>
    <script>
        let change = () => {
            console.log("Helooo");

            let p1 = document.getElementsByClassName("1");
            let p2 = document.getElementsByClassName("2");
            for (let index = 0; index < p1.length; index++) {
                p1[index].style.backgroundColor = "red"

            }

            for (let index = 0; index < p1.length; index++) {                
                p2[index].style.backgroundColor = "blue"

            }


        }
