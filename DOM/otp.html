<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="hh"></h1>
    <script>
        let generateOTP = () => {
            const otp = Math.floor(100000 + Math.random() * 900000);
            document.getElementById("hh").innerText = otp;

        }
        setInterval(() => {
            generateOTP()

        }, 1000)





    </script>
</body>

</html>
