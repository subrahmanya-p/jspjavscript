<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-family: 'Franklin Gothic Medium';
        }
    </style>
</head>

<body>
    <p class="1">1</p>
    <p class="1">2</p>
    <p class="1">3</p>
    <p class="1">4</p>
    <p class="1">5</p>
    <p class="1">6</p>
    <p class="1">7</p>
    <p class="1">8</p>
    <p class="1">9</p>
    <p class="1">10</p>
    <button onclick="change()">Click me</button>
    <script>

        let change = () => {
            let paras = document.getElementsByClassName("1")
            for (let element of paras) {
                element.style.fontSize = "20px"
                element.style.fontWeight = "bold"
                element.style.fontFamily = 'Franklin Gothic Medium';
                let letters = "abcdefghijklmnopqrstuvwxyz".split("");
                let randomWord = "";
                randomWord += letters[(Math.trunc(Math.random() * 26))] + letters[(Math.trunc(Math.random() * 26))] + letters[(Math.trunc(Math.random() * 26))] + letters[(Math.trunc(Math.random() * 26))] + letters[(Math.trunc(Math.random() * 26))];

                element.innerHTML = randomWord;

            }
        }
        setInterval(()=>{
            change()
        },2000)
    </script>

</body>

</html>
