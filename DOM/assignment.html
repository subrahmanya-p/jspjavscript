<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="1">Heading Level 1</h1>
    <h1 id="2">Heading Level 2</h1>
    <h1 id="3">Heading Level 3</h1>
    <h1 id="4">Heading Level 4</h1>

    <h1 id="5">Heading Level 5</h1>
    <button onclick="change()"> Click MEEEE</button>



    <script>

        let change = () => {

            let generateColor = () => {

                let colorarr = '0123456789ABCDEF'.split("");
                return `#${colorarr[Math.trunc(Math.random() * 16)]}${colorarr[Math.trunc(Math.random() * 16)]}${colorarr[Math.trunc(Math.random() * 16)]}${colorarr[Math.trunc(Math.random() * 16)]}${colorarr[Math.trunc(Math.random() * 16)]}${colorarr[Math.trunc(Math.random() * 16)]}`
            }

            for (let index = 1; index <= 5; index++) {

                document.getElementById(index).style.backgroundColor = generateColor();
                document.getElementById(index).style.color = generateColor();


            }
        }
        setInterval(() => {
            change()
        }, 1000)
    </script>
</body>

</html>
