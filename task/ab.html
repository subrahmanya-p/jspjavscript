<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .con {
            position: absolute;
            height: 1px;
            width: 1px;
            background-color: rgb(0, 0, 0);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* transform: translateX(-50%) scale(-1); */
            /* transition: all 0.9s ease; */
            top: -100%;
            left: 50%;
        }

        .show {
            background-color: rgb(0, 246, 164);
            border-radius: 5%;
             height: 100px;
            width: 250px;
            left: 50%;
            opacity: 1;
            top: 50%;
            /* transform: translateX(-50%) scale(0.5); */
        }
    </style>
</head>

<body>

    <button id="come">Click me</button>

    <div class="con" id="message">
        <h5>Hello</h5>
        <button id="go">OK</button>
    </div>

    <script>
        let come = document.getElementById("come");
        let go = document.getElementById("go");
        let con = document.getElementById("message");
        come.addEventListener("click", () => {
            con.classList.add("show");
        });
        go.addEventListener("click", () => {
            con.classList.remove("show");
        });
    </script>

</body>

</html>
