<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con {
            margin: 5px;
            height: 150px;
            width: 120px;
            background-color: rgb(212, 232, 225);
            list-style: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            align-items: center;
            transition: all 1s ease;

        }

        li {
            list-style: none;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            /* ? font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
        }

        .dis {
            display: none;
        }

        button {
            padding: 10px 30px;
            background-color: green;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 10px;

            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
        }
    </style>
</head>

<body>
    <button>Drop Down</button>
    <div class="con">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Careers</li>
            <li>Contact</li>
            <li>Visit</li>
            <li>Services</li>
        </ul>

    </div>
    <script>
        document.querySelector("button").addEventListener("click", () => {
            document.querySelector("div").classList.toggle("dis")
        })

    </script>
</body>

</html>
